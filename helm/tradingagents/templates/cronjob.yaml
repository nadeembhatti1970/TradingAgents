apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "tradingagents.fullname" . }}
spec:
  schedule: {{ .Values.schedule | quote }}
  timeZone: {{ .Values.timeZone | quote }}
  suspend: {{ .Values.suspend }}
  concurrencyPolicy: {{ .Values.concurrencyPolicy }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.backoffLimit }}
      activeDeadlineSeconds: {{ .Values.activeDeadlineSeconds }}
      template:
        spec:
          restartPolicy: Never
          # The trading pod calls no Kubernetes API; the projected service-account
          # volume is what failed to mount on 2026-11-09 and killed the job.
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: tradingagents
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["sh", "-c"]
              args:
                - |
                  status=0
                  {{- if .Values.run.etf }}
                  tickers="$(tradingagents etf-holdings {{ .Values.run.etf | quote }} --top {{ .Values.run.topN }})" || tickers=""
                  if [ -z "$tickers" ] || [ "$(echo "$tickers" | wc -w)" -lt {{ .Values.run.topN }} ]; then
                    echo "ETF holdings unavailable or incomplete; using fallback tickers"
                    tickers={{ join " " .Values.run.fallbackTickers | quote }}
                  fi
                  {{- else }}
                  tickers={{ join " " .Values.run.tickers | quote }}
                  {{- end }}
                  if [ -z "$tickers" ]; then
                    echo "No tickers to analyse"
                    exit 1
                  fi
                  for ticker in $tickers; do
                    # --skip-completed makes the one-run-per-ticker/date guard
                    # part of the run rather than a shell convention.
                    tradingagents --ticker "$ticker" --date "$(date +%F)" \
                      --analysts {{ .Values.run.analysts | quote }} \
                      {{ if .Values.run.skipCompleted }}--skip-completed{{ end }} \
                      --save --no-show || status=1
                  done
                  # Measurement, not trading: refresh the forward scoreboard and
                  # the broker snapshot even if an analysis failed.
                  tradingagents performance --trend-overlay --save --broker || true
                  exit $status
              envFrom:
                - configMapRef:
                    name: {{ include "tradingagents.fullname" . }}
                - secretRef:
                    name: {{ .Values.secrets.existingSecret }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
              volumeMounts:
                - name: data
                  mountPath: /home/appuser/.tradingagents
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              {{- if .Values.persistence.enabled }}
              persistentVolumeClaim:
                claimName: {{ include "tradingagents.claimName" . }}
              {{- else }}
              emptyDir: {}
              {{- end }}
            - name: tmp
              emptyDir: {}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
