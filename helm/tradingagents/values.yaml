image:
  repository: nadeembhatti/tradingagents
  tag: sha-b79649f7526e9fd93b6858e78bb5a4cfab3ebb2a
  pullPolicy: IfNotPresent

# One CronJob run analyses every ticker with today's date.
# Weekly, Monday 11:00 London: a daily re-decision was flipping ratings and the
# 20-day/60-day thesis does not need a daily run. The five-day scoreboard is a
# smoke test; the gate is 20 days. DeepSeek 1017 on OpenRouter costs double
# 01:00-04:00 and 06:00-10:00 UTC on weekdays; 11:00 London starts at or after
# 10:00 UTC all year, so a ~75 minute run stays at the standard price and
# finishes well before the 16:30 LSE close.
schedule: "0 11 * * 1"
timeZone: Europe/London
suspend: false
concurrencyPolicy: Forbid
backoffLimit: 0
activeDeadlineSeconds: 10800

run:
  # When etf is set, the topN largest holdings of that ETF are analysed
  # instead of tickers (Yahoo lists at most ~10 holdings per fund).
  etf: "ISF.L"
  topN: 10
  tickers: ["NVDA"]
  # Used when the ETF holdings feed fails or returns fewer than topN names.
  fallbackTickers:
    - AZN.L
    - HSBA.L
    - SHEL.L
    - ULVR.L
    - RR.L
    - BP.L
    - BATS.L
    - GSK.L
    - RIO.L
    - LLOY.L
  analysts: "market,social,news,fundamentals"
  # Skip tickers that already finished an analysis today (e.g. a manual job after the schedule).
  skipCompleted: true

# Non-secret TRADINGAGENTS_* settings. Real-money trading requires
# tradeMode: real and a non-zero maxBuyValue; both default to the safe values.
config:
  tradeMode: practice
  maxBuyValue: "50"
  maxDailyBuyValue: "250"
  # The CLI cannot prompt in a pod, so the LLM and run settings are required.
  extra:
    TRADINGAGENTS_LLM_PROVIDER: openrouter
    TRADINGAGENTS_QUICK_THINK_LLM: deepseek/deepseek-v4.1-flash-1017
    TRADINGAGENTS_DEEP_THINK_LLM: deepseek/deepseek-v4.1-flash-1017
    TRADINGAGENTS_OUTPUT_LANGUAGE: English
    TRADINGAGENTS_MAX_DEBATE_ROUNDS: "1"
    TRADINGAGENTS_MAX_RISK_ROUNDS: "1"
    # Same-day reruns flipped ratings (RR.L Underweight, Underweight, then Overweight); cut sampling noise.
    TRADINGAGENTS_TEMPERATURE: "0.0"
    # Bound a model that otherwise emits 200k-300k output tokens per run.
    TRADINGAGENTS_MAX_TOKENS: "8192"
    # Give the agents the practice/live account's cash and positions.
    TRADINGAGENTS_T212_AUTO_PORTFOLIO: "true"
    # StockTwits and Reddit have no usable coverage of LSE tickers; news-only sentiment.
    TRADINGAGENTS_SENTIMENT_SOCIAL: "false"
    TYPESAFE_BASE_URL: https://openrouter.ai/api
    TYPESAFE_DEFAULT_MODEL: jev-latest

# Existing Secret holding the LLM provider keys and broker credentials,
# e.g. OPENAI_API_KEY, ALPACA_API_KEY, ALPACA_SECRET_KEY.
secrets:
  existingSecret: tradingagents-secrets

persistence:
  enabled: true
  size: 2Gi
  storageClass: ""
  existingClaim: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

nodeSelector: {}
tolerations: []
