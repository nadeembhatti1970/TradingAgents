image:
  repository: nadeembhatti/tradingagents
  tag: sha-09f81fcf307a01b12596d2e907d3d5c1678b25bc
  pullPolicy: IfNotPresent

# One CronJob run analyses every ticker with today's date.
schedule: "30 13 * * 1-5"
timeZone: Etc/UTC
suspend: false
concurrencyPolicy: Forbid
backoffLimit: 0
activeDeadlineSeconds: 7200

run:
  # When etf is set, the topN largest holdings of that ETF are analysed
  # instead of tickers (Yahoo lists at most ~10 holdings per fund).
  etf: "ISF.L"
  topN: 10
  tickers: ["NVDA"]
  analysts: "market,social,news,fundamentals"

# Non-secret TRADINGAGENTS_* settings. Real-money trading requires
# tradeMode: real and a non-zero maxBuyValue; both default to the safe values.
config:
  tradeMode: practice
  maxBuyValue: "50"
  maxDailyBuyValue: "250"
  # The CLI cannot prompt in a pod, so the LLM and run settings are required.
  extra:
    TRADINGAGENTS_LLM_PROVIDER: openrouter
    TRADINGAGENTS_QUICK_THINK_LLM: deepseek/deepseek-v4.1-flash-1017
    TRADINGAGENTS_DEEP_THINK_LLM: deepseek/deepseek-v4.1-flash-1017
    TRADINGAGENTS_OUTPUT_LANGUAGE: English
    TRADINGAGENTS_MAX_DEBATE_ROUNDS: "1"
    TRADINGAGENTS_MAX_RISK_ROUNDS: "1"

# Existing Secret holding the LLM provider keys and broker credentials,
# e.g. OPENAI_API_KEY, ALPACA_API_KEY, ALPACA_SECRET_KEY.
secrets:
  existingSecret: tradingagents-secrets

persistence:
  enabled: true
  size: 2Gi
  storageClass: ""
  existingClaim: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

nodeSelector: {}
tolerations: []
